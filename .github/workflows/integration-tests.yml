name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel outdated workflow runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Environment variables
env:
  NODE_ENV: test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: cloudretail_test
  REDIS_HOST: localhost
  REDIS_PORT: 6380
  RABBITMQ_HOST: localhost
  RABBITMQ_PORT: 5673
  RABBITMQ_USER: guest
  RABBITMQ_PASS: guest

# Job definitions
jobs:
  # Setup job - Start test infrastructure
  setup:
    name: Setup Infrastructure
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env files for services
        run: |
          # Create env files for each service
          for service in api-gateway user-service product-service order-service inventory-service dashboard-service; do
            cat > $service/.env << EOF
            NODE_ENV=test
            PORT=${{ matrix.node-version == '18' && 3001 || 3001 }}
            DATABASE_URL=postgres://postgres:postgres@localhost:5433/cloudretail_test
            REDIS_URL=redis://localhost:6380
            RABBITMQ_URL=amqp://guest:guest@localhost:5673
            JWT_SECRET=test-jwt-secret-for-integration-testing
            EOF
          done

      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Start test infrastructure
        run: docker-compose -f docker-compose.test.yml up -d

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            if docker exec cloudretail-test-postgres pg_isready -U postgres > /dev/null 2>&1; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
          echo "PostgreSQL failed to start"
          exit 1

      - name: Wait for Redis to be ready
        run: |
          for i in {1..30}; do
            if docker exec cloudretail-test-redis redis-cli ping > /dev/null 2>&1; then
              echo "Redis is ready"
              exit 0
            fi
            echo "Waiting for Redis... ($i/30)"
            sleep 2
          done
          echo "Redis failed to start"
          exit 1

      - name: Wait for RabbitMQ to be ready
        run: |
          for i in {1..30}; do
            if docker exec cloudretail-test-rabbitmq rabbitmq-diagnostics check_port_connectivity > /dev/null 2>&1; then
              echo "RabbitMQ is ready"
              exit 0
            fi
            echo "Waiting for RabbitMQ... ($i/30)"
            sleep 2
          done
          echo "RabbitMQ failed to start"
          exit 1

      - name: Set matrix output
        id: set-matrix
        run: |
          echo "matrix={\"node-version\":[\"18\",\"20\"]}" >> $GITHUB_OUTPUT

      - name: Create infrastructure startup artifact
        run: |
          echo "Infrastructure started at $(date)" > infrastructure-status.txt
          mkdir -p artifacts
          mv infrastructure-status.txt artifacts/

      - name: Upload infrastructure status
        uses: actions/upload-artifact@v3
        with:
          name: infrastructure-status
          path: artifacts/

  # User Service Tests
  test-user-service:
    name: User Service Tests (Node ${{ matrix.node-version }})
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]
    services:
      postgres:
        image: postgres:15-alpine
        ports:
          - 5433:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cloudretail_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
      rabbitmq:
        image: rabbitmq:3.12-alpine
        ports:
          - 5673:5672
          - 15673:15672
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics check_port_connectivity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: user-service/package-lock.json

      - name: Install dependencies
        working-directory: ./user-service
        run: npm ci

      - name: Create .env file
        working-directory: ./user-service
        run: |
          cat > .env << EOF
          NODE_ENV=test
          PORT=3001
          DATABASE_URL=postgres://postgres:postgres@localhost:5433/cloudretail_test
          REDIS_URL=redis://localhost:6380
          RABBITMQ_URL=amqp://guest:guest@localhost:5673
          JWT_SECRET=test-jwt-secret-for-integration-testing
          JWT_EXPIRES_IN=1h
          BCRYPT_ROUNDS=10
          EOF

      - name: Run User Service Tests
        working-directory: ./user-service
        run: npm test -- --testPathPattern=integration --forceExit
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/cloudretail_test
          REDIS_URL: redis://localhost:6380
          RABBITMQ_URL: amqp://guest:guest@localhost:5673

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-user-service-${{ matrix.node-version }}
          path: user-service/coverage/

      - name: Upload test results
        if: always()
