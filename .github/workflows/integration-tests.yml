          REDIS_URL=redis://localhost:6380
          RABBITMQ_URL=amqp://guest:guest@localhost:5673
          JWT_SECRET=test-jwt-secret-for-integration-testing
          PRODUCT_SERVICE_URL=http://localhost:3002
          ORDER_SERVICE_URL=http://localhost:3003
          EOF

          # API Gateway
          cat > api-gateway/.env << EOF
          NODE_ENV=test
          PORT=3000
          DATABASE_URL=postgres://postgres:postgres@localhost:5433/cloudretail_test
          REDIS_URL=redis://localhost:6380
          RABBITMQ_URL=amqp://guest:guest@localhost:5673
          JWT_SECRET=test-jwt-secret-for-integration-testing
          USER_SERVICE_URL=http://localhost:3001
          PRODUCT_SERVICE_URL=http://localhost:3002
          ORDER_SERVICE_URL=http://localhost:3003
          INVENTORY_SERVICE_URL=http://localhost:3004
          DASHBOARD_SERVICE_URL=http://localhost:3005
          RATE_LIMIT_WINDOW_MS=900000
          RATE_LIMIT_MAX_REQUESTS=100
          EOF

          # Dashboard Service
          cat > dashboard-service/.env << EOF
          NODE_ENV=test
          PORT=3005
          DATABASE_URL=postgres://postgres:postgres@localhost:5433/cloudretail_test
          REDIS_URL=redis://localhost:6380
          RABBITMQ_URL=amqp://guest:guest@localhost:5673
          JWT_SECRET=test-jwt-secret-for-integration-testing
          PRODUCT_SERVICE_URL=http://localhost:3002
          ORDER_SERVICE_URL=http://localhost:3003
          INVENTORY_SERVICE_URL=http://localhost:3004
          USER_SERVICE_URL=http://localhost:3001
          CACHE_TTL=300
          AGGREGATION_INTERVAL=60000
          EOF

      - name: Start all services in background
        run: |
          # Start each service in background
          cd user-service && npm start > /tmp/user-service.log 2>&1 &
          echo $! > /tmp/user-service.pid
          cd ../product-service && npm start > /tmp/product-service.log 2>&1 &
          echo $! > /tmp/product-service.pid
          cd ../order-service && npm start > /tmp/order-service.log 2>&1 &
          echo $! > /tmp/order-service.pid
          cd ../inventory-service && npm start > /tmp/inventory-service.log 2>&1 &
          echo $! > /tmp/inventory-service.pid
          cd ../dashboard-service && npm start > /tmp/dashboard-service.log 2>&1 &
          echo $! > /tmp/dashboard-service.pid
          cd ../api-gateway && npm start > /tmp/api-gateway.log 2>&1 &
          echo $! > /tmp/api-gateway.pid
          cd ..

      - name: Wait for services to start
        run: |
          echo "Waiting for services to start..."
          sleep 15
          for i in {1..30}; do
            if curl -s http://localhost:3000/api/health > /dev/null 2>&1 && \
               curl -s http://localhost:3001/api/health > /dev/null 2>&1 && \
               curl -s http://localhost:3002/api/health > /dev/null 2>&1 && \
               curl -s http://localhost:3003/api/health > /dev/null 2>&1 && \
               curl -s http://localhost:3004/api/health > /dev/null 2>&1 && \
               curl -s http://localhost:3005/api/health > /dev/null 2>&1; then
              echo "All services are healthy"
              exit 0
            fi
            echo "Waiting for services... ($i/30)"
            sleep 2
          done
          echo "Some services failed to start"
          cat /tmp/*.log | tail -50
          exit 1

      - name: Run End-to-End Tests
        run: |
          # Create E2E test script
          cat > e2e-tests.js << 'EOF'
          const http = require('http');
          const https = require('https');
          
          const BASE_URL = process.env.API_GATEWAY_URL || 'http://localhost:3000';
          
          // Helper function to make HTTP requests
          function request(method, path, data = null, headers = {}) {
            return new Promise((resolve, reject) => {
              const url = new URL(path, BASE_URL);
              const client = url.protocol === 'https:' ? https : http;
              
              const options = {
                hostname: url.hostname,
                port: url.port,
                path: url.pathname,
                method: method,
                headers: {
                  'Content-Type': 'application/json',
                  ...headers
                }
              };
              
              const req = client.request(options, (res) => {
                let body = '';
                res.on('data', chunk => body += chunk);
                res.on('end', () => {
                  try {
                    resolve({ status: res.statusCode, body: JSON.parse(body) });
                  } catch (e) {
                    resolve({ status: res.statusCode, body: body });
                  }
                });
              });
              
              req.on('error', reject);
              
              if (data) {
                req.write(JSON.stringify(data));
              }
              req.end();
            });
          }
          
          // E2E Test Scenarios
          async function runE2ETests() {
            const results = {
              userFlow: false,
              productFlow: false,
              orderFlow: false,
              inventoryFlow: false,
              gatewayFlow: false
            };
            
            try {
              // 1. User Flow: Register → Login → Get Profile
              console.log('Testing User Flow...');
              const registerData = {
                email: `test${Date.now()}@example.com`,
                password: 'password123',
                name: 'Test User'
              };
              const register = await request('POST', '/api/auth/register', registerData);
              if (register.status === 201 || register.status === 200) {
                const login = await request('POST', '/api/auth/login', {
                  email: registerData.email,
                  password: registerData.password
                });
                if (login.status === 200 && login.body.token) {
                  const profile = await request('GET', '/api/profile', null, {
                    'Authorization': `Bearer ${login.body.token}`
                  });
                  results.userFlow = profile.status === 200;
                }
              }
              console.log('User Flow:', results.userFlow ? 'PASSED' : 'FAILED');
              
              // 2. Product Flow: Create Product → Get Product → Update → Delete
              console.log('Testing Product Flow...');
              const productData = {
                name: 'Test Product',
                description: 'A test product',
                price: 29.99,
                sku: `SKU-${Date.now()}`,
                category: 'Electronics',
                stock: 100
              };
              const createProduct = await request('POST', '/api/products', productData);
              if (createProduct.status === 201) {
                const getProduct = await request('GET', `/api/products/${createProduct.body.id}`);
                if (getProduct.status === 200) {
                  const updateProduct = await request('PUT', `/api/products/${createProduct.body.id}`, {
                    price: 39.99
                  });
                  results.productFlow = updateProduct.status === 200;
                }
              }
              console.log('Product Flow:', results.productFlow ? 'PASSED' : 'FAILED');
              
              // 3. Order Flow: Create Order → Get Order → Update Status
              console.log('Testing Order Flow...');
              const orderData = {
                items: [
                  { productId: createProduct.body?.id, quantity: 2 }
                ],
                shippingAddress: {
                  street: '123 Test St',
                  city: 'Test City',
                  zip: '12345'
                }
              };
              const createOrder = await request('POST', '/api/orders', orderData);
              if (createOrder.status === 201) {
                const getOrder = await request('GET', `/api/orders/${createOrder.body.id}`);
                if (getOrder.status === 200) {
                  const updateStatus = await request('PUT', `/api/orders/${createOrder.body.id}/status`, {
                    status: 'processing'
                  });
                  results.orderFlow = updateStatus.status === 200;
                }
              }
              console.log('Order Flow:', results.orderFlow ? 'PASSED' : 'FAILED');
              
              // 4. Inventory Flow: Update Stock → Reserve → Release
              console.log('Testing Inventory Flow...');
              const inventoryData = {
                productId: createProduct.body?.id,
                quantity: 50,
                location: 'Warehouse A'
              };
              const updateStock = await request('POST', '/api/inventory/stock', inventoryData);
              if (updateStock.status === 201) {
                const reserveData = {
                  productId: createProduct.body?.id,
                  quantity: 10,
                  orderId: createOrder.body?.id
                };
                const reserve = await request('POST', '/api/inventory/reserve', reserveData);
                if (reserve.status === 201) {
                  const release = await request('POST', '/api/inventory/release', {
                    reservationId: reserve.body.id
                  });
                  results.inventoryFlow = release.status === 200;
                }
              }
              console.log('Inventory Flow:', results.inventoryFlow ? 'PASSED' : 'FAILED');
              
              // 5. Gateway Flow: Route requests with auth middleware
              console.log('Testing Gateway Flow...');
              const unauthorizedAccess = await request('GET', '/api/products');
              results.gatewayFlow = unauthorizedAccess.status === 401;
              
              const authorizedAccess = await request('GET', '/api/products', null, {
                'Authorization': `Bearer ${login?.body?.token || ''}`
              });
              if (authorizedAccess.status === 200) {
                results.gatewayFlow = true;
              }
              console.log('Gateway Flow:', results.gatewayFlow ? 'PASSED' : 'FAILED');
              
              // Summary
              console.log('\n========== E2E Test Results ==========');
              console.log('User Flow:', results.userFlow ? '✓' : '✗');
              console.log('Product Flow:', results.productFlow ? '✓' : '✗');
              console.log('Order Flow:', results.orderFlow ? '✓' : '✗');
              console.log('Inventory Flow:', results.inventoryFlow ? '✓' : '✗');
              console.log('Gateway Flow:', results.gatewayFlow ? '✓' : '✗');
              
              const allPassed = Object.values(results).every(r => r);
              console.log('\nOverall:', allPassed ? 'ALL TESTS PASSED' : 'SOME TESTS FAILED');
              
              process.exit(allPassed ? 0 : 1);
            } catch (error) {
              console.error('E2E Test Error:', error.message);
              process.exit(1);
            }
          }
          
          runE2ETests();
          EOF
          
          node e2e-tests.js
        env:
          API_GATEWAY_URL: http://localhost:3000

      - name: Cleanup services
        if: always()
        run: |
          # Kill all running services
          for pidfile in /tmp/*.pid; do
            if [ -f "$pidfile" ]; then
              kill $(cat "$pidfile") 2>/dev/null || true
            fi
          done
          
          # Wait for services to stop
          sleep 5
          
          # Kill any remaining node processes
          pkill -f "node.*server.js" || true
          
          echo "Services cleaned up"

  # Load Tests (Optional)
  load-tests:
    name: Load Tests
    needs: setup
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start infrastructure
        run: docker-compose -f docker-compose.test.yml up -d

      - name: Wait for services
        run: |
          for i in {1..60}; do
            if docker exec cloudretail-test-postgres pg_isready -U postgres > /dev/null 2>&1 && \
               docker exec cloudretail-test-redis redis-cli ping > /dev/null 2>&1 && \
               docker exec cloudretail-test-rabbitmq rabbitmq-diagnostics check_port_connectivity > /dev/null 2>&1; then
              echo "All services ready"
              exit 0
            fi
            sleep 2
          done
          echo "Timeout waiting for services"
          exit 1

      - name: Set up k6 for load testing
        run: |
          # Install k6
          curl -s https://get.k6.io | sh
          export PATH=$PATH:$HOME/k6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install service dependencies and start services
        run: |
          # Start API Gateway for load testing
          cd api-gateway && npm ci && npm start > /tmp/api-gateway.log 2>&1 &
          cd ../user-service && npm ci && npm start > /tmp/user-service.log 2>&1 &
          cd ../product-service && npm ci && npm start > /tmp/product-service.log 2>&1 &
          cd ../order-service && npm ci && npm start > /tmp/order-service.log 2>&1 &
          cd ../inventory-service && npm ci && npm start > /tmp/inventory-service.log 2>&1 &
          cd ../dashboard-service && npm ci && npm start > /tmp/dashboard-service.log 2>&1 &
          cd ..

      - name: Wait for services to be ready
        run: |
          sleep 30
          for i in {1..30}; do
            if curl -s http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "API Gateway is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Timeout waiting for services"
          cat /tmp/*.log | tail -100
          exit 1

      - name: Run Load Tests
        run: |
          export PATH=$PATH:$HOME/k6
          k6 run load-tests/load-test.js
        env:
          BASE_URL: http://localhost:3000

      - name: Cleanup
        if: always()
        run: |
          docker-compose -f docker-compose.test.yml down -v
          pkill -f "node.*server.js" || true

  # Coverage Report
  coverage:
    name: Coverage Report
    needs: [test-user-service, test-product-service, test-order-service, test-inventory-service, test-api-gateway, test-dashboard-service]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all coverage reports
        uses: actions/download-artifact@v3
        with:
          path: coverage-reports

      - name: Combine coverage reports
        run: |
          # Install lcov tools
          apt-get update -qq && apt-get install -y -qq lcov > /dev/null 2>&1
            
          # Create combined coverage directory
          mkdir -p combined-coverage
          
          # Find and combine all lcov files
          find coverage-reports -name "*.lcov" -type f | while read file; do
            echo "Processing: $file"
            basename=$(basename $(dirname "$file"))
            lcov -a "$file" -o "combined-coverage/${bas basename}.lcov" 2>/dev/null || true
          done
          
          # Generate combined report
          lcov --capture --directory . --output-file "combined-coverage/lcov.info" --ignore-errors source > /dev/null 2>&1 || true
          
          # Generate HTML report
          genhtml combined-coverage/lcov.info --output-directory combined-coverage/html --title "CloudRetail Coverage Report" > /dev/null 2>&1 || true

      - name: Upload combined coverage
        uses: actions/upload-artifact@v3
        with:
          name: combined-coverage
          path: combined-coverage/

      - name: Coverage Summary
        run: |
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Coverage reports have been generated and are available as artifacts." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Per-Service Coverage:" >> $GITHUB_STEP_SUMMARY
          ls -la coverage-reports/ | grep "^d" | while read dir; do
            echo "- $dir" >> $GITHUB_STEP_SUMMARY
          done

      - name: Codecov Upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v3
        with:
          directory: ./coverage-reports
          fail_ci_if_error: false

  # Cleanup
  cleanup:
    name: Cleanup
    needs: [setup, test-user-service, test-product-service, test-order-service, test-inventory-service, test-api-gateway, test-dashboard-service, e2e-tests, coverage]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Stop and cleanup test infrastructure
        run: |
          docker-compose -f docker-compose.test.yml down -v --remove-orphans 2>/dev/null || true
          
          # Remove any lingering containers
          docker ps -aq --filter "name=cloudretail-test" | xargs -r docker rm -f 2>/dev/null || true
          
          echo "Test infrastructure cleaned up"

      - name: Cleanup artifacts
        uses: geekyeggo/delete-artifact@v2
        with:
          name: |
            infrastructure-status
            coverage-*
            test-results-*
          continueOnError: true

  # Post PR Comment with Results
  pr-comment:
    name: Post PR Comment
    needs: [test-user-service, test-product-service, test-order-service, test-inventory-service, test-api-gateway, test-dashboard-service, e2e-tests]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get test results
        id: results
        run: |
          # Download test results
          mkdir -p test-results
          
          # Collect test results from all jobs
          echo "## Integration Test Results" >> test-results/summary.md
          echo "" >> test-results/summary.md
          echo "### Service Tests" >> test-results/summary.md
          echo "" >> test-results/summary.md
          echo "| Service | Status |" >> test-results/summary.md
          echo "|---------|--------|" >> test-results/summary.md
          
          # User Service
          if curl -sSf "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/logs" 2>/dev/null | grep -q "test-user-service"; then
