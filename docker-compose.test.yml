version: '3.8'

services:
  # Test PostgreSQL Database
  test-postgres:
    image: postgres:15-alpine
    container_name: cloudretail-test-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloudretail_test
    ports:
      - "5433:5432"
    volumes:
      - test-postgres-data:/var/lib/postgresql/data
    networks:
      - cloudretail-test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Test Redis Cache
  test-redis:
    image: redis:7-alpine
    container_name: cloudretail-test-redis
    ports:
      - "6380:6379"
    volumes:
      - test-redis-data:/data
    networks:
      - cloudretail-test
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Test RabbitMQ Message Broker
  test-rabbitmq:
    image: rabbitmq:3.12-alpine
    container_name: cloudretail-test-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - test-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - cloudretail-test
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  test-postgres-data:
    driver: local
  test-redis-data:
    driver: local
  test-rabbitmq-data:
    driver: local

networks:
  cloudretail-test:
    driver: bridge
