apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cloudretail

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - redis-deployment.yaml
  - api-gateway-deployment.yaml
  - user-service-deployment.yaml
  - product-service-deployment.yaml
  - inventory-service-deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml

# Reduce replicas to 1 per service to fit EKS cluster capacity
# (4 t3.micro nodes with 4 pods max per node = 16 total capacity)
# System pods consume 2-4 pods per node, so only 4 microservices can run
replicas:
  - name: api-gateway
    count: 1
  - name: user-service
    count: 1
  - name: product-service
    count: 1
  - name: inventory-service
    count: 1

# Common labels for all resources
commonLabels:
  app: cloudretail
  environment: production

# Replacements for placeholders
replacements:
  - source:
      kind: ConfigMap
      name: cloudretail-config
      fieldPath: data.AWS_REGION
    targets:
      - select:
          kind: Deployment
        fieldPaths:
          - metadata.annotations.[kubernetes.io/region]
        options:
          create: true
    # Note: This is a placeholder for region annotation replacement
    # In practice, you may need to use a different approach


